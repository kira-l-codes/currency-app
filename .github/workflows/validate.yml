name: validate

# Verification only. Nothing here tags, publishes, deploys or builds a release APK: the web suites and
# the JVM tests run on every push so a regression cannot hide behind a green release run.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prove_failure_path:
        description: "Deliberately fail the web tests (through tee) to prove the job goes red"
        type: boolean
        default: false
      prove_missing_reports:
        description: "Point the JVM reporter at an empty directory to prove a zero cannot look green"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web suites (logic, motion, DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix web

      # `shell: bash` is explicit and `pipefail` is set, because a pipeline returns the status of its
      # last command — `tee` — which is 0 even when the suite failed. Without this, a red suite could
      # report a green step.
      - name: Run web tests
        shell: bash
        run: |
          set -euo pipefail
          cd web
          # The default (TAP) reporter, because its `# tests` lines are the ones a reader can verify.
          node --test tests/*.test.mjs 2>&1 | tee /tmp/web-tests.log

      # The failure path is proven on demand, never left in the normal suite: dispatch this workflow
      # with prove_failure_path=true and this step must fail although its output also goes through tee.
      - name: Prove the failure path (dispatch only)
        if: ${{ inputs.prove_failure_path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "this command fails on purpose; the step must still fail through tee"
          ( echo "deliberate failure"; exit 7 ) 2>&1 | tee /tmp/proven-failure.log

      # Printed, not only written to the summary: a number nobody can read in the log is not evidence.
      - name: Report the counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          COUNTS="$(grep -E '^# (tests|pass|fail)' /tmp/web-tests.log || echo 'no summary lines')"
          printf '%s\n' "$COUNTS"
          {
            echo "### Web tests"
            echo '```'
            printf '%s\n' "$COUNTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      # Robolectric downloads its android-all jars at test time into ~/.m2. Caching them keeps the
      # suite from depending on a Maven round trip on every run.
      - name: Cache Gradle and Robolectric jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Robolectric's first run fetches an android-all jar from Maven; a network blip must not read as
      # a code failure, and a real failure fails all three attempts and still goes red.
      - name: Run unit tests
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --console=plain; then
              echo "unit tests passed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed (a downloaded artifact or a real failure); retrying"
            sleep 20
          done
          echo "unit tests failed three times"
          exit 1

      # Parsed structurally, not with a regex over the first 600 bytes. A missing, malformed or
      # empty report fails this step: a reassuring "0 tests / 0 failures" would read as coverage
      # that does not exist. Failures, errors and skips are reported separately.
      # No pipe here on purpose: `python3 ... | tee` would hand the step tee's status, so a missing
      # report could exit 0. `set -e` plus a plain redirect makes the script's status the step's.
      - name: Report the counts
        if: always()
        shell: bash
        env:
          RESULTS_DIR: ${{ inputs.prove_missing_reports && 'app/build/test-results/EMPTY' || 'app/build/test-results/testDebugUnitTest' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/jvm-counts.txt
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          results = os.environ.get("RESULTS_DIR", "app/build/test-results/testDebugUnitTest")
          files = sorted(glob.glob(f"{results}/TEST-*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          unreadable = []

          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:                  # malformed XML is a failure, not a zero
                  unreadable.append(f"{path}: {exc}")
                  continue
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              if suite is None:
                  unreadable.append(f"{path}: no <testsuite> element")
                  continue
              for key in totals:
                  totals[key] += int(suite.get(key, 0) or 0)

          print("### JVM tests\n")
          print(f"reports: {len(files)} files")
          print("\n| tests | failures | errors | skipped |")
          print("| --- | --- | --- | --- |")
          print(f"| {totals['tests']} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |")

          if unreadable:
              print("\n**Unreadable reports:**")
              for line in unreadable:
                  print(f"- {line}")

          if not files:
              print("\n**No test reports were produced — this is not a passing result.**")
              sys.exit(1)
          if unreadable:
              sys.exit(1)
          if totals["tests"] == 0:
              print("\n**Zero tests ran — this is not a passing result.**")
              sys.exit(1)
          if totals["failures"] or totals["errors"]:
              sys.exit(1)
          PY
          cat /tmp/jvm-counts.txt
          cat /tmp/jvm-counts.txt >> "$GITHUB_STEP_SUMMARY"
